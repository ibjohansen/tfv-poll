name: Code quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_USER: tfv_test
          POSTGRES_PASSWORD: tfv_test_local_only
          POSTGRES_DB: tfv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tfv_test -d tfv_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use project Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # The current Next.js lint dependency chain contains an upstream-only
      # advisory with no compatible fix. Deployed dependencies remain blocking.
      - name: Check deployed dependencies for known high or critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Lint, test and build
        run: npm run check
      - name: Test real Postgres migrations, triggers and concurrency
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://tfv_test:tfv_test_local_only@127.0.0.1:5432/tfv_test
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile browser flows with synthetic data
        run: npm run test:e2e
      - name: Enforce production-build performance budgets
        run: npm run test:performance
